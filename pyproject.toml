[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgen-samplebind"
version = "0.5.1"
description = "Bind PFILE/BFILE/EIGENSTRAT genotype datasets sharing a variant set; the missing plink2 --pmerge case for ancient-DNA / population-genetics workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Carsten Erickson", email = "carstene@mailbox.org" },
]
keywords = ["bioinformatics", "genetics", "plink2", "pgen", "ancient-dna", "admixtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "Pgenlib==0.94.0",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "click>=8.1,<9",
    "tqdm>=4.66,<5",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
pgen-samplebind = "pgen_samplebind.cli:main"

[project.urls]
Homepage = "https://github.com/carstenerickson/pgen-samplebind"
Repository = "https://github.com/carstenerickson/pgen-samplebind"
Issues = "https://github.com/carstenerickson/pgen-samplebind/issues"
Changelog = "https://github.com/carstenerickson/pgen-samplebind/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgen_samplebind = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by ruff format

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pgen_samplebind"]

[[tool.mypy.overrides]]
module = "pgenlib"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests > 30 s wallclock (HLD tests 17 mergeit parity, 18 perf bench)",
    "eigenstrat: requires plink2 with EIGENSTRAT support (HLD tests 7, 8, 13, 15, 16)",
    "network: requires internet (HLD test 14 AADR Dataverse fetch)",
    "external_tool: requires AT2 / mergeit binaries (HLD test 17)",
    "dogfood: AADR-derivative regression tests (see tests/dogfood/README.md)",
    "dogfood_plink2: dogfood subset requiring plink2 on PATH",
    "dogfood_full: dogfood subset requiring R + admixtools (full qpAdm shootout)",
]
addopts = "-ra --strict-markers"
