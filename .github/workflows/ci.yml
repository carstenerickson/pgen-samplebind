name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JS-based actions in to Node.js 24 ahead of GitHub's June 2026 forced
# migration. ci.yml currently only uses checkout@v5 + setup-python@v6 (already
# on Node 24); kept here for consistency with release.yml so future action
# additions don't trip the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # plink2 v2.0.0-a.7.1 (HLD-verified version) installed directly from
      # the upstream GitHub release. Bioconda's latest is 2.0.0a.6.9 which
      # PRE-DATES the EIGENSOFT --eigfile --make-pgen support introduced in
      # v2.0.0-a.7.0; HLD test #15 (plink2 a7.x quirks) requires a.7.x.
      - name: Install plink2 v2.0.0-a.7.1
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   ASSET="plink2_linux_x86_64.zip" ;;
            macOS-ARM64) ASSET="plink2_mac_arm64.zip" ;;
            macOS-X64)   ASSET="plink2_mac.zip" ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          URL="https://github.com/chrchang/plink-ng/releases/download/v2.0.0-a.7.1/${ASSET}"
          mkdir -p "$RUNNER_TEMP/plink2"
          curl -fsSL -o "$RUNNER_TEMP/plink2.zip" "$URL"
          unzip -q "$RUNNER_TEMP/plink2.zip" -d "$RUNNER_TEMP/plink2"
          chmod +x "$RUNNER_TEMP/plink2/plink2"
          echo "$RUNNER_TEMP/plink2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/plink2/plink2" --version

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Tests
        run: pytest -m "not slow and not external_tool" --cov=src/pgen_samplebind --cov-report=term-missing

  bench:
    name: Perf benchmark gate (linux-x86_64 only)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # HLD test 18 (perf benchmark gate). Linux x86_64 only — macOS runners
      # have inconsistent CPU profiles per LLD §5.7. Baseline lives in
      # tests/integration/perf_baseline.json; failure means a regression
      # below 80 % of the recorded throughput.
      - name: Perf benchmark
        run: pytest tests/integration/test_perf_benchmark.py -m slow --no-cov -v

  dogfood:
    # Named status check for the AADR-derivative regression test suite.
    # Tier 1 (default) + Tier 2 (`dogfood_plink2`) also run inside the main
    # `test` matrix as a side-effect of the marker selector; this dedicated
    # job adds Tier 3 (`dogfood_full`) which needs R + admixtools, AND gives
    # the test set its own visible status check on PRs. See
    # tests/dogfood/README.md for tier descriptions and fair-use rationale.
    name: Dogfood / AADR regression (all tiers)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # plink2 v2.0.0-a.7.1 — same script as the main test job. The
      # dogfood_plink2 + dogfood_full tiers both need it on PATH.
      - name: Install plink2 v2.0.0-a.7.1
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/chrchang/plink-ng/releases/download/v2.0.0-a.7.1/plink2_linux_x86_64.zip"
          mkdir -p "$RUNNER_TEMP/plink2"
          curl -fsSL -o "$RUNNER_TEMP/plink2.zip" "$URL"
          unzip -q "$RUNNER_TEMP/plink2.zip" -d "$RUNNER_TEMP/plink2"
          chmod +x "$RUNNER_TEMP/plink2/plink2"
          echo "$RUNNER_TEMP/plink2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/plink2/plink2" --version

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      # Cache R packages so admixtools and its deps install once per CI
      # lockfile, not once per run. Cold build is ~6-8 min; warm is ~5 sec.
      # Cache key includes the admixtools ref so a ref bump auto-invalidates.
      - name: Cache R packages
        id: cache-r
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-admixtools-${{ runner.os }}-R4.4-stable-build-runnable-v1

      - name: Install system deps for R packages
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libssl-dev libcurl4-openssl-dev libgsl-dev libfontconfig1-dev \
            libglpk-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      # We install from a maintained fork (carstenerickson/admixtools) on the
      # `stable/build-runnable` branch — a curated merge of the upstream PRs
      # that are required for the package to (a) compile against current
      # RcppArmadillo 15+ and (b) run against current readr / igraph / dplyr.
      # The package's own src/Makevars carries the C++17 bump, so no global
      # ~/.R/Makevars override is needed here.
      - name: Install admixtools R package (carstenerickson fork, stable/build-runnable)
        if: steps.cache-r.outputs.cache-hit != 'true'
        env:
          # remotes::install_github falls back to anonymous API calls (60/hr)
          # unless GITHUB_PAT is set. The Actions-provided GITHUB_TOKEN raises
          # the limit to 5000/hr — comfortably enough for one install pass.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages("remotes", repos="https://packagemanager.posit.co/cran/__linux__/jammy/latest")'
          Rscript -e 'remotes::install_github("carstenerickson/admixtools@stable/build-runnable", upgrade="never", build_vignettes=FALSE)'

      - name: Verify admixtools loads
        run: Rscript -e 'suppressPackageStartupMessages(library(admixtools)); cat("admixtools", as.character(packageVersion("admixtools")), "\n")'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Run all dogfood tiers. The default + plink2 tiers were already
      # covered in the main `test` job; rerunning them here means this job
      # is self-contained and can be triggered standalone for diagnostic
      # purposes.
      - name: Dogfood tests (all tiers)
        run: pytest tests/dogfood/ -v --no-cov

